<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mosaic - Adaptive Bitrate Video Packaging for Go</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Predictable, Production-Ready Adaptive Bitrate (ABR) Video Packaging for Go (HLS & DASH CMAF)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --theme-color: #0066cc;
      --sidebar-width: 280px;
      --sidebar-background: #f8fafc;
      --sidebar-nav-link-color: #334155;
      --sidebar-nav-link-color--active: #0066cc;
      --cover-background-color: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --code-inline-background: #f1f5f9;
      --code-inline-color: #0f172a;
      --table-row-odd-background: #f8fafc;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --base-background-color: #0f172a;
        --base-color: #e2e8f0;
        --sidebar-background: #090d16;
        --sidebar-nav-link-color: #94a3b8;
        --sidebar-nav-link-color--active: #38bdf8;
        --code-inline-background: #1e293b;
        --code-inline-color: #38bdf8;
        --table-row-odd-background: #1e293b;
        --table-cell-border-color: #334155;
      }
    }

    .app-name-link img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .cover-main img {
      max-width: 140px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    .markdown-section code {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }

    .sidebar-nav strong {
      color: #64748b;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-top: 1.2em;
      margin-bottom: 0.4em;
    }
  </style>
</head>
<body>
  <div id="app">Loading Mosaic Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Mosaic',
      repo: 'https://github.com/farshidrezaei/mosaic',
      logo: 'assets/logo.jpg',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      }
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  
  <!-- Mermaid Support -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: "default" });
    window.mermaid = mermaid;
  </script>
  <script src="https://unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
