name: 🚀 Feature Request
description: Propose a new feature, optimization, or API enhancement for Mosaic
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and proposals from the community!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / API Design
      description: Describe the solution you'd like to see. Include proposed Go API signatures or options if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative approaches or workarounds you have considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a Pull Request for this feature.
